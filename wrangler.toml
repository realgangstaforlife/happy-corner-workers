name = "happy-corner-workers"
main = "src/index.js"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

# =======================================================
# ENTORNO: STAGING (npm run deploy:staging / wrangler deploy --env staging)
# =======================================================
[env.staging]
name = "happy-corner-workers-staging"
# vars = { FIREBASE_PROJECT_ID = "tu-project-id", FIREBASE_CLIENT_EMAIL = "tu-client-email", ALLOWED_ORIGINS = "https://staging.happycorner.top" }
# 
# [[env.staging.r2_buckets]]
# binding = "BUCKET"
# bucket_name = "happy-corner-storage-staging"

# =======================================================
# ENTORNO: PRODUCTION (npm run deploy / wrangler deploy)
# =======================================================
# [vars]
# FIREBASE_PROJECT_ID = "tu-project-id"
# FIREBASE_CLIENT_EMAIL = "tu-client-email"
# ALLOWED_ORIGINS = "https://happycorner.top,https://www.happycorner.top"
# 
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "happy-corner-storage"
# preview_bucket_name = "happy-corner-storage-dev"

# =======================================================
# SECRETS (Para ambos entornos)
# =======================================================
# Los secrets (FIREBASE_PRIVATE_KEY y RESEND_API_KEY) no van en texto plano.
# Debes configurarlos usando:
# npx wrangler secret put FIREBASE_PRIVATE_KEY --env staging
# npx wrangler secret put RESEND_API_KEY --env staging
